# Description:
# Creates a Release Candidate (RC) tag on main and builds a signed staging APK.
#
# Steps (full release):
#   1. Computes the next version from conventional commits (feat → minor, fix/other → patch)
#   2. Bumps package.json and commits it back to main [skip ci]
#   3. Creates and pushes the vX.Y.Z-rc.N tag
#   4. Creates a GitHub pre-release
#   5. Builds a signed staging APK + AAB (APP_ENV=staging) and uploads them to the pre-release
#
# Rebuild only (workflow_dispatch with a tag):
#   Skips the release steps and rebuilds the APK + AAB for the provided RC tag.
#   Use this when you need to rebuild after changing a GitHub variable/secret.
#
# Trigger:
#   - Automatically on every push to main (full release)
#   - Manually via workflow_dispatch with a required RC tag (rebuild only)
#   Both pause at the "staging" environment gate until a reviewer approves it.
#   Configure required reviewers at:
#   Settings > Environments > staging > Required reviewers
#
# GITHUB SECRETS/VARS REQUIRED:
#   Repo-level secrets:
#     - RELEASE_APP_ID            GitHub App ID (must bypass branch protection on main)
#     - RELEASE_APP_PRIVATE_KEY   GitHub App private key
#     - KEYSTORE_PASSWORD         Android signing keystore password
#     - KEY_PASSWORD              Android signing key password
#   Repo-level variables:
#     - KEYSTORE_BASE64           base64-encoded release keystore (base64 -w 0 release-key.jks)
#     - KEY_ALIAS                 Android signing key alias
#     - OPEN_FOOD_FACTS_API_BASE_URL
#   "staging" environment secrets:
#     - SECRET_KEY
#     - GOOGLE_MAPS_API_KEY
#   "staging" environment variables:
#     - RZO_API_BASE_URL          staging API URL (e.g. https://staging.api.example.com)

name: Release IOS

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      tag:
        description: 'RC tag to rebuild (e.g. v1.2.3-rc.1).'
        required: true

jobs:
  release-rc:
    name: Create RC tag + Build staging APK
    runs-on: macos-latest
    environment: staging
    concurrency:
      group: release-rc
      cancel-in-progress: false
    permissions:
      contents: write

    env:
      APP_ENV: staging
      EXPO_NO_DOTENV: '1'
      SECRET_KEY: ${{ secrets.SECRET_KEY }}
      RZO_API_BASE_URL: ${{ vars.RZO_API_BASE_URL }}
      OPEN_FOOD_FACTS_API_BASE_URL: ${{ vars.OPEN_FOOD_FACTS_API_BASE_URL }}

    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - name: Validate tag input
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          INPUT_TAG="${{ github.event.inputs.tag }}"
          if [[ ! "$INPUT_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-rc\.[0-9]+$ ]]; then
            echo "❌ Invalid tag format: '${INPUT_TAG}'. Expected e.g. v1.2.3-rc.1"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', github.event.inputs.tag) || 'main' }}
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Configure git
        run: |
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"

      - name: Compute next version and RC tag
        id: release
        if: github.event_name == 'push'
        run: |
          git fetch --tags

          # Current version from latest stable tag (v0.0.0 if none)
          LATEST_TAG=$(git tag -l "v[0-9]*.[0-9]*.[0-9]*" \
            | grep -v '\-rc\.' | sort -V | tail -1)
          CURRENT="${LATEST_TAG#v}"
          CURRENT="${CURRENT:-0.0.0}"

          # Bump type from conventional commits since last STABLE tag.
          # We deliberately base off the latest STABLE tag (not any RC) to avoid
          # version regression (e.g. 0.0.0 + patch → 0.0.1 after a feat already
          # bumped to 0.1.0-rc.1).
          if [ -z "$LATEST_TAG" ]; then
            COMMITS=$(git log --pretty=format:"%s")
          else
            COMMITS=$(git log --pretty=format:"%s" "${LATEST_TAG}..HEAD")
          fi

          if echo "$COMMITS" | grep -qE '^[a-z]+(\([^)]+\))?!:|BREAKING CHANGE'; then
            BUMP="major"
          elif echo "$COMMITS" | grep -qE '^feat(\([^)]+\))?:'; then
            BUMP="minor"
          else
            BUMP="patch"
          fi
          echo "Bump type: $BUMP (current: $CURRENT)"

          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"
          case "$BUMP" in
            major) NEW_VERSION="$((MAJOR + 1)).0.0" ;;
            minor) NEW_VERSION="${MAJOR}.$((MINOR + 1)).0" ;;
            *)     NEW_VERSION="${MAJOR}.${MINOR}.$((PATCH + 1))" ;;
          esac

          LATEST_RC=$(git tag -l "v${NEW_VERSION}-rc.*" | sort -V | tail -1)
          if [ -z "$LATEST_RC" ]; then
            RC_NUMBER=1
          else
            RC_NUMBER=$(echo "$LATEST_RC" | grep -oP '\d+$')
            RC_NUMBER=$((RC_NUMBER + 1))
          fi

          echo "new_version=${NEW_VERSION}" >> $GITHUB_OUTPUT
          echo "rc_tag=v${NEW_VERSION}-rc.${RC_NUMBER}" >> $GITHUB_OUTPUT

      - name: Bump package.json version
        if: github.event_name == 'push'
        run: |
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            pkg.version = '${{ steps.release.outputs.new_version }}';
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          "

      - name: Commit and push version bump
        if: github.event_name == 'push'
        run: |
          git add package.json
          if git diff --staged --quiet; then
            echo "package.json already at ${{ steps.release.outputs.new_version }}, skipping commit."
          else
            git commit -m "chore(release): bump version to ${{ steps.release.outputs.new_version }} [skip ci]"
            git push origin main
          fi

      - name: Create and push RC tag
        if: github.event_name == 'push'
        run: |
          git tag -a ${{ steps.release.outputs.rc_tag }} -m "${{ steps.release.outputs.rc_tag }}"
          git push origin ${{ steps.release.outputs.rc_tag }}

      - name: Create GitHub pre-release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          RC_TAG="${{ steps.release.outputs.rc_tag }}"
          LATEST_STABLE=$(git tag -l "v[0-9]*.[0-9]*.[0-9]*" \
            | grep -v '\-rc\.' | sort -V | tail -1)
          if [ -n "$LATEST_STABLE" ]; then
            gh release create "${RC_TAG}" \
              --title "Pre-release ${RC_TAG}" \
              --generate-notes \
              --notes-start-tag "${LATEST_STABLE}" \
              --prerelease \
              --verify-tag
          else
            gh release create "${RC_TAG}" \
              --title "Pre-release ${RC_TAG}" \
              --generate-notes \
              --prerelease \
              --verify-tag
          fi

      - name: Resolve build tag
        id: build-tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ steps.release.outputs.rc_tag }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node + PNPM + install deps
        uses: ./.github/actions/setup-node-pnpm-install

      - name: ☕ Set Up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - name: Compute versionCode from semver
        run: |
          node -e "
            const v = require('./package.json').version;
            const m = v.match(/^(\\d+)\\.(\\d+)\\.(\\d+)$/);
            if (!m) { console.error('Invalid version: ' + v); process.exit(1); }
            const code = +m[1]*1000000 + +m[2]*1000 + +m[3];
            console.log('VERSION_CODE=' + code);
          " >> $GITHUB_ENV

      - name: Prebuild (generate ios/ folder)
        run: pnpm prebuild:staging

      - name: Build app for ios
        uses: sparkfabrik/ios-build-action@v2.3.0
        with:
          upload-to-testflight: false
          increment-build-number: false
          build-pods: true
          pods-path: "ios/Podfile"
          configuration: Release
          export-method: app-store
          project-path: "ios/rzocoeurmobileapp.xcodeproj"
          output-path: build-${{ github.sha }}.ipa
          team-id: ${{ secrets.TEAM_ID }}
          team-name: ${{ secrets.TEAM_NAME }}
          ios-app-id: com.rzocoeurmobileapp         


      - name: Summary
        run: |
          echo "### ✅ RC tag created: \`${{ steps.release.outputs.rc_tag }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Staging APK built with \`APP_ENV=staging\` and \`RZO_API_BASE_URL\` from the **staging** environment." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "To promote to production, approve the **Release Promote** run gated on the **production** environment." >> $GITHUB_STEP_SUMMARY
