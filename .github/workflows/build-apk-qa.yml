# ✍️ Description:
# Builds a staging APK directly on a GitHub runner (no EAS required).
# Triggered automatically when a Release Candidate tag (v*-rc*) is pushed,
# or manually from the Actions tab.
# The APK is uploaded as a GitHub Actions artifact and can be downloaded
# from the Actions run summary page.
#
# 🚨 GITHUB SECRETS REQUIRED (Settings → Secrets and variables → Actions):
#   - SECRET_KEY
#   - RZO_API_BASE_URL
#   - GOOGLE_MAPS_API_KEY
#   - KEYSTORE_BASE64      (base64 -w 0 release-key.jks)
#   - KEYSTORE_PASSWORD    (keystore password)
#   - KEY_ALIAS            (key alias)
#   - KEY_PASSWORD         (key password)

name: Build QA APK (Android)

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*-rc*'

jobs:
  build:
    name: Build QA APK (Android)
    runs-on: ubuntu-latest

    env:
      APP_ENV: development
      EXPO_NO_DOTENV: '1'
      # Secrets (Settings → Secrets and variables → Secrets)
      SECRET_KEY: ${{ secrets.SECRET_KEY }}
      GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
      RZO_API_BASE_URL: ${{ secrets.RZO_API_BASE_URL }}
      # Variables (Settings → Secrets and variables → Variables)
      OPEN_FOOD_FACTS_API_BASE_URL: ${{ vars.OPEN_FOOD_FACTS_API_BASE_URL }}
      KEYSTORE_BASE64: ${{ vars.KEYSTORE_BASE64 }}
      KEY_ALIAS: ${{ vars.KEY_ALIAS }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

    steps:
      - name: 📦 Checkout project repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 📦 Setup Node + PNPM + install deps
        uses: ./.github/actions/setup-node-pnpm-install

      - name: ☕ Set Up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - name: 🐘 Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: 🔢 Compute versionCode from semver
        run: |
          node -e "
            const v = require('./package.json').version;
            const m = v.match(/^(\\d+)\\.(\\d+)\\.(\\d+)$/);
            if (!m) { console.error('Invalid version: ' + v); process.exit(1); }
            const code = +m[1]*1000000 + +m[2]*1000 + +m[3];
            console.log('VERSION_CODE=' + code);
          " >> $GITHUB_ENV

      - name: 🏗️ Prebuild (generate android/ folder)
        run: pnpm prebuild:development

      - name: 🔑 Decode keystore
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > ${{ runner.temp }}/release-key.jks

      - name: 🔨 Build release APK + AAB
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleRelease bundleRelease --no-daemon \
            -Pandroid.injected.signing.store.file=${{ runner.temp }}/release-key.jks \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"
          cd ..

      - name: 📤 Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-development-${{ github.ref_name || github.run_number }}.apk
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 14

      - name: 📤 Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-development-${{ github.ref_name || github.run_number }}.aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 14
