# Description:
# Promotes a Release Candidate tag to a stable production tag and builds a signed production APK.
#
# Steps (full promote):
#   1. Triggered automatically when an RC tag (v*-rc.*) is pushed by release-rc.yml
#   2. Pauses at the "production" environment gate until a reviewer approves
#   3. Creates the stable tag (vX.Y.Z) pointing to the same commit as the RC
#   4. Builds a signed production APK + AAB (APP_ENV=production) and uploads them
#   5. Creates a GitHub Release with auto-generated release notes
#
# Rebuild only (workflow_dispatch with a tag):
#   Skips the promotion steps and rebuilds the APK + AAB for the provided stable tag.
#   Use this when you need to rebuild after changing a GitHub variable/secret.
#
# Trigger:
#   - Automatically when an RC tag (v*-rc.*) is pushed (full promote)
#   - Manually via workflow_dispatch with a required stable tag (rebuild only)
#   Both pause at the "production" environment gate until a reviewer approves it.
#   Configure required reviewers at:
#   Settings > Environments > production > Required reviewers
#
# GITHUB SECRETS/VARS REQUIRED:
#   Repo-level secrets:
#     - RELEASE_APP_ID            GitHub App ID (must bypass branch protection on main)
#     - RELEASE_APP_PRIVATE_KEY   GitHub App private key
#     - KEYSTORE_PASSWORD         Android signing keystore password
#     - KEY_PASSWORD              Android signing key password
#   Repo-level variables:
#     - KEYSTORE_BASE64           base64-encoded release keystore (base64 -w 0 release-key.jks)
#     - KEY_ALIAS                 Android signing key alias
#     - OPEN_FOOD_FACTS_API_BASE_URL
#   "production" environment secrets:
#     - SECRET_KEY
#     - GOOGLE_MAPS_API_KEY
#   "production" environment variables:
#     - RZO_API_BASE_URL          production API URL (e.g. https://api.example.com)

name: Release Promote

on:
  push:
    tags:
      - 'v*-rc.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Stable tag to rebuild (e.g. v1.2.3). Skips the promotion steps — only rebuilds the APK + AAB.'
        required: true

jobs:
  release-promote:
    name: Promote RC tag to stable + Build production APK
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: release
      cancel-in-progress: false
    permissions:
      contents: write

    env:
      APP_ENV: production
      EXPO_NO_DOTENV: '1'
      SECRET_KEY: ${{ secrets.SECRET_KEY }}
      GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
      RZO_API_BASE_URL: ${{ vars.RZO_API_BASE_URL }}
      OPEN_FOOD_FACTS_API_BASE_URL: ${{ vars.OPEN_FOOD_FACTS_API_BASE_URL }}
      KEYSTORE_BASE64: ${{ vars.KEYSTORE_BASE64 }}
      KEY_ALIAS: ${{ vars.KEY_ALIAS }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - name: Validate tag input
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          INPUT_TAG="${{ github.event.inputs.tag }}"
          if [[ ! "$INPUT_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "❌ Invalid tag format: '${INPUT_TAG}'. Expected e.g. v1.2.3"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', github.event.inputs.tag) || github.ref_name }}
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Configure git
        run: |
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"

      - name: Extract stable version
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            STABLE_TAG="${{ github.event.inputs.tag }}"
            if [ -z "$STABLE_TAG" ]; then
              echo "❌ No tag provided. Please specify a stable tag (e.g. v1.2.3)"
              exit 1
            fi
            if [[ ! "$STABLE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "❌ Invalid tag format: ${STABLE_TAG}. Expected e.g. v1.2.3"
              exit 1
            fi
          else
            RC_TAG="${{ github.ref_name }}"
            STABLE_TAG=$(echo "$RC_TAG" | sed 's/-rc\.[0-9]*$//')
          fi
          echo "stable_tag=${STABLE_TAG}" >> "$GITHUB_OUTPUT"

      - name: Ensure stable tag does not already exist
        if: github.event_name == 'push'
        run: |
          STABLE_TAG="${{ steps.version.outputs.stable_tag }}"
          git fetch --tags
          if git rev-parse "$STABLE_TAG" >/dev/null 2>&1; then
            echo "❌ Stable tag $STABLE_TAG already exists. Aborting."
            exit 1
          fi

      - name: Create and push stable tag
        if: github.event_name == 'push'
        run: |
          git tag -a ${{ steps.version.outputs.stable_tag }} -m "${{ steps.version.outputs.stable_tag }}"
          git push origin ${{ steps.version.outputs.stable_tag }}

      - name: Setup Node + PNPM + install deps
        uses: ./.github/actions/setup-node-pnpm-install

      - name: ☕ Set Up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compute versionCode from semver
        run: |
          node -e "
            const v = require('./package.json').version;
            const m = v.match(/^(\\d+)\\.(\\d+)\\.(\\d+)$/);
            if (!m) { console.error('Invalid version: ' + v); process.exit(1); }
            const code = +m[1]*1000000 + +m[2]*1000 + +m[3];
            console.log('VERSION_CODE=' + code);
          " >> $GITHUB_ENV

      - name: Prebuild (generate android/ folder)
        run: pnpm prebuild:production

      - name: Decode keystore
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > ${{ runner.temp }}/release-key.jks

      - name: Build production APK + AAB
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleRelease bundleRelease --no-daemon \
            -Pandroid.injected.signing.store.file=${{ runner.temp }}/release-key.jks \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"
          cd ..

      - name: Create GitHub Release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          STABLE_TAG="${{ steps.version.outputs.stable_tag }}"

          # Without --notes-start-tag, GitHub compares from the nearest git tag
          # (the RC), which points to the same commit → zero PRs in range → empty notes.
          # Force start from the previous stable tag.
          PREV_STABLE=$(git tag -l "v[0-9]*.[0-9]*.[0-9]*" \
            | grep -v '\-rc\.' | grep -v "^${STABLE_TAG}$" | sort -V | tail -1)

          if [ -n "$PREV_STABLE" ]; then
            gh release create "${STABLE_TAG}" \
              --title "Release ${STABLE_TAG}" \
              --generate-notes \
              --notes-start-tag "${PREV_STABLE}" \
              --verify-tag
          else
            gh release create "${STABLE_TAG}" \
              --title "Release ${STABLE_TAG}" \
              --generate-notes \
              --verify-tag
          fi

      - name: Upload APK to release
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          gh release upload "${{ steps.version.outputs.stable_tag }}" \
            android/app/build/outputs/apk/release/app-release.apk \
            --clobber

      - name: Upload AAB to release
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          gh release upload "${{ steps.version.outputs.stable_tag }}" \
            android/app/build/outputs/bundle/release/app-release.aab \
            --clobber

      - name: 📋 Summary
        run: |
          echo "### ✅ Promoted \`${{ github.ref_name }}\` → \`${{ steps.version.outputs.stable_tag }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Production APK built with \`APP_ENV=production\` and \`RZO_API_BASE_URL\` from the **production** environment." >> $GITHUB_STEP_SUMMARY
