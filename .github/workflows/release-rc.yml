# ✍️ Description:
# Creates a Release Candidate (RC) tag on main.
#
# Steps:
#   1. Bumps the version in package.json (patch / minor / major)
#   2. Computes the next RC number for that version (v1.2.3-rc.1, v1.2.3-rc.2, …)
#   3. Commits the version bump
#   4. Pushes the commit and the RC tag
#   → The push of the tag automatically triggers build-apk-qa.yml (staging APK)
#
# 🚨 GITHUB SECRETS REQUIRED:
#   - RELEASE_APP_ID: GitHub App ID
#   - RELEASE_APP_PRIVATE_KEY: GitHub App private key
#   The app must have Contents: Read & Write permission and be added to the
#   branch protection bypass list for main.

name: Release RC

on:
  workflow_dispatch:
    inputs:
      release-type:
        type: choice
        description: 'Release type (one of): patch, minor, major'
        required: true
        default: 'patch'
        options:
          - patch
          - minor
          - major

jobs:
  release-rc:
    name: Create RC tag on main
    runs-on: ubuntu-latest
    concurrency:
      group: release
      cancel-in-progress: false
    permissions:
      contents: write

    steps:
      - name: 🤖 Generate bot token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - name: 📦 Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: 📝 Git user setup
        run: |
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"

      - name: 🔢 Bump version in package.json
        id: bump
        run: |
          RELEASE_TYPE="${{ github.event.inputs.release-type }}"
          CURRENT=$(node -p "require('./package.json').version")
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"

          case "$RELEASE_TYPE" in
            major) NEW_VERSION="$((MAJOR + 1)).0.0" ;;
            minor) NEW_VERSION="${MAJOR}.$((MINOR + 1)).0" ;;
            patch) NEW_VERSION="${MAJOR}.${MINOR}.$((PATCH + 1))" ;;
          esac

          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('./package.json', 'utf8'));
            pkg.version = '${NEW_VERSION}';
            fs.writeFileSync('./package.json', JSON.stringify(pkg, null, 2) + '\n');
          "

          echo "new_version=${NEW_VERSION}" >> $GITHUB_OUTPUT

      - name: 🔢 Compute RC number
        id: rc
        run: |
          NEW_VERSION="${{ steps.bump.outputs.new_version }}"
          git fetch --tags
          LATEST=$(git tag -l "v${NEW_VERSION}-rc.*" | sort -V | tail -1)

          if [ -z "$LATEST" ]; then
            RC_NUMBER=1
          else
            RC_NUMBER=$(echo "$LATEST" | grep -oP '\d+$')
            RC_NUMBER=$((RC_NUMBER + 1))
          fi

          RC_TAG="v${NEW_VERSION}-rc.${RC_NUMBER}"
          echo "rc_tag=${RC_TAG}" >> $GITHUB_OUTPUT

      - name: 📝 Commit version bump
        run: |
          git add package.json
          git commit -m "chore(release): bump version to ${{ steps.rc.outputs.rc_tag }}"

      - name: 🏷️ Create and push RC tag
        run: |
          git tag -a ${{ steps.rc.outputs.rc_tag }} -m "${{ steps.rc.outputs.rc_tag }}"
          git push origin main
          git push origin ${{ steps.rc.outputs.rc_tag }}

      - name: 🎉 Summary
        run: |
          echo "### ✅ RC tag created: \`${{ steps.rc.outputs.rc_tag }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "A staging APK build has been triggered automatically." >> $GITHUB_STEP_SUMMARY
